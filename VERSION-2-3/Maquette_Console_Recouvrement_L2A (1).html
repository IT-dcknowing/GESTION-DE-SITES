<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L2A · Recouvrement — Maquette applicative</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --noir:#191B20; --noir2:#22252C; --rouge:#C8102E; --rouge-d:#9C0C24;
  --ivoire:#F4F2EC; --carte:#FFFFFF; --acier:#5A6472; --ligne:#E3E0D8;
  --vert:#1E7B34; --ambre:#B87A00; --encre:#22252C;
  --t1:#8A94A3; --t2:#5A6472; --t3:#B87A00; --t4:#D9541E; --t5:#C8102E;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--ivoire);color:var(--encre);font-size:14px}
h1,h2,h3,.kpi-val{font-family:'Archivo',sans-serif}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
/* ---------- Sidebar ---------- */
.side{background:var(--noir);color:#EDEBE4;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{padding:20px 18px 14px;border-bottom:1px solid #2E323B}
.logo b{font-family:'Archivo';font-weight:800;font-size:17px;letter-spacing:.3px;display:block}
.logo b span{color:var(--rouge)}
.logo small{color:#9AA0AB;font-size:11px;letter-spacing:.8px;text-transform:uppercase}
.badge{margin:14px;border:1px solid #343945;border-radius:10px;padding:12px;background:linear-gradient(160deg,#22252C,#191B20)}
.badge .b-role{font-family:'Archivo';font-weight:700;font-size:15px}
.badge .b-tag{display:inline-block;margin-top:6px;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:var(--rouge);color:#fff;font-weight:600}
.badge .b-name{color:#9AA0AB;font-size:11px;margin-top:6px}
.badge select{width:100%;margin-top:10px;background:#111318;color:#EDEBE4;border:1px solid #343945;border-radius:6px;padding:7px 8px;font-family:'IBM Plex Sans';font-size:12px}
nav{flex:1;padding:6px 10px;overflow:auto}
nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;color:#C9CDD5;padding:10px 12px;border-radius:8px;cursor:pointer;font-family:'IBM Plex Sans';font-size:13px;margin:2px 0}
nav button:hover{background:#23262E}
nav button.on{background:var(--rouge);color:#fff;font-weight:600}
nav button.lock{opacity:.38;cursor:not-allowed}
nav button .ic{width:16px;text-align:center}
.side-foot{padding:12px 16px;font-size:10.5px;color:#7C828D;border-top:1px solid #2E323B;line-height:1.5}
/* ---------- Main ---------- */
main{padding:26px 30px 60px;max-width:1240px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.top h1{font-size:22px;font-weight:800;letter-spacing:.2px}
.top .sub{color:var(--acier);font-size:12.5px;margin-top:3px}
.datebox{background:var(--carte);border:1px solid var(--ligne);border-radius:10px;padding:8px 12px;display:flex;gap:10px;align-items:center}
.datebox label{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--acier);font-weight:600}
.datebox input{border:1px solid var(--ligne);border-radius:6px;padding:6px 8px;font-family:'IBM Plex Mono';font-size:13px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:980px){.app{grid-template-columns:1fr}.side{position:static;height:auto}.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--carte);border:1px solid var(--ligne);border-radius:12px;padding:18px}
.card h2{font-size:14px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--noir);border-bottom:2px solid var(--noir);padding-bottom:9px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.card h2 .chip{font-family:'IBM Plex Sans';font-weight:600;font-size:10px;letter-spacing:.8px;background:var(--ivoire);border:1px solid var(--ligne);border-radius:20px;padding:3px 9px;color:var(--acier);text-transform:uppercase}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--carte);border:1px solid var(--ligne);border-left:4px solid var(--noir);border-radius:10px;padding:13px 15px}
.kpi.red{border-left-color:var(--rouge)}
.kpi .k-lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--acier);font-weight:600}
.kpi-val{font-size:21px;font-weight:800;margin-top:4px}
.kpi .k-sub{font-size:11px;color:var(--acier);margin-top:2px}
/* Formulaires */
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:11px}
.fld label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--acier);font-weight:600;margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--ligne);border-radius:7px;padding:8px 9px;font-family:'IBM Plex Sans';font-size:13px;background:#FDFCF9}
.fld input:focus,.fld select:focus{outline:2px solid var(--rouge);outline-offset:1px;border-color:var(--rouge)}
.fld .mono{font-family:'IBM Plex Mono'}
.hint{font-size:11.5px;margin-top:9px;padding:8px 10px;border-radius:7px;background:var(--ivoire);border:1px dashed var(--ligne);color:var(--acier)}
.hint.ok{color:var(--vert);border-color:var(--vert);background:#F0F7F1}
.hint.warn{color:var(--rouge);border-color:var(--rouge);background:#FCF0F2;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:8px;padding:10px 16px;font-family:'Archivo';font-weight:700;font-size:13px;letter-spacing:.3px;cursor:pointer;transition:transform .05s}
.btn:active{transform:translateY(1px)}
.btn-r{background:var(--rouge);color:#fff}.btn-r:hover{background:var(--rouge-d)}
.btn-n{background:var(--noir);color:#fff}
.btn-o{background:none;border:1.5px solid var(--noir);color:var(--noir)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.actions{margin-top:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* Tables */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:#fff;background:var(--noir);padding:8px 9px;text-align:left;position:sticky;top:0}
th.num,td.num{text-align:right}
td{padding:7px 9px;border-bottom:1px solid var(--ligne);vertical-align:top}
tr:hover td{background:#FAF8F2}
tr.tot td{background:var(--noir);color:#fff;font-weight:700;border:0}
.tbl-wrap{max-height:430px;overflow:auto;border:1px solid var(--ligne);border-radius:9px}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:600;letter-spacing:.3px;white-space:nowrap}
.pN0{background:#EEF0F3;color:var(--acier)}.pN1{background:#E8ECF5;color:#3A5A8C}
.pN2{background:#FFF4DE;color:var(--ambre)}.pN3{background:#FFE9D6;color:#C05A12}
.pN4{background:#FBD9DE;color:var(--rouge)}.pN5{background:var(--rouge);color:#fff}
.pOK{background:#E5F2E8;color:var(--vert)}
/* Balance âgée : nuancier */
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.bar{display:flex;height:26px;border-radius:6px;overflow:hidden;border:1px solid var(--ligne)}
.bar div{height:100%}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--acier)}
/* Écarts */
.neg{color:var(--rouge);font-weight:700}.pos{color:var(--vert);font-weight:700}
.cmt{width:100%;border:1px dashed var(--ligne);background:#FFFDF5;border-radius:7px;padding:7px;font-size:12px;font-family:'IBM Plex Sans';min-height:34px}
/* Toast + audit */
#toast{position:fixed;bottom:22px;right:22px;background:var(--noir);color:#fff;padding:13px 18px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.28);opacity:0;transform:translateY(8px);transition:.25s;z-index:50;border-left:4px solid var(--rouge);max-width:380px}
#toast.show{opacity:1;transform:none}
.locknote{background:#FCF0F2;border:1px solid #F2C6CD;color:var(--rouge);border-radius:9px;padding:11px 13px;font-size:12.5px;font-weight:600;margin-bottom:14px}
.view{display:none}.view.on{display:block}
@media print{ .side,.top .datebox,.actions,nav,#toast,.no-print{display:none!important} .app{grid-template-columns:1fr} main{padding:0;max-width:none} .card{border:0} body{background:#fff} }
</style>
</head>

/* ================= Calculs métier ================= */
function workDate(){ return new Date(document.getElementById('workDate').value + 'T00:00:00'); }
function rap(f){ return f.ttc - f.regle - f.encPost; }
function anc(f){ if(!f.date) return null; return Math.max(0, Math.round((workDate() - new Date(f.date+'T00:00:00'))/86400000)); }
function niveau(f){
  if(rap(f) <= 0.5) return {n:0, lbl:'Soldée', cls:'pOK'};
  const a = anc(f);
  if(a === null) return {n:0, lbl:'À dater', cls:'pN0'};
  if(a >= 90) return {n:5, lbl:'N5 · Contentieux', cls:'pN5'};
  if(a >= 60) return {n:4, lbl:'N4 · Mise en demeure', cls:'pN4'};
  if(a >= 30) return {n:3, lbl:'N3 · Lettre de relance', cls:'pN3'};
  if(a >= 15) return {n:2, lbl:'N2 · Téléphone', cls:'pN2'};
  if(a >= 7)  return {n:1, lbl:'N1 · E-mail', cls:'pN1'};
  return {n:0, lbl:'Courante', cls:'pN0'};
}
const TRANCHES = [
  {lbl:'0-30 j', c:'var(--t1)', test:a=>a<=30},{lbl:'31-60 j', c:'var(--t2)', test:a=>a<=60},
  {lbl:'61-90 j', c:'var(--t3)', test:a=>a<=90},{lbl:'91-180 j', c:'var(--t4)', test:a=>a<=180},
  {lbl:'+180 j', c:'var(--t5)', test:a=>true}];
function tranche(f){ const a=anc(f); if(a===null) return -1; for(let i=0;i<TRANCHES.length;i++) if(TRANCHES[i].test(a)) return i; }
function ouvertes(){ return factures.filter(f=>rap(f)>0.5); }
function sumEnc(from,to){ return encaissements.filter(e=>{const d=new Date(e.date+'T00:00:00');return d>=from&&d<=to;}).reduce((s,e)=>s+e.montant,0); }
function periodes(){
  const d = workDate();
  const lundi = new Date(d); lundi.setDate(d.getDate()-((d.getDay()+6)%7));
  const m1 = new Date(d.getFullYear(), d.getMonth(), 1);
  const dm = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  return [
    {k:'jour', lbl:'Jour — '+d.toLocaleDateString('fr-FR'), real:sumEnc(d,d), obj:OBJ_HEBDO/JOURS_OUVRES},
    {k:'semaine', lbl:'Semaine en cours (du '+lundi.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})+')', real:sumEnc(lundi,d), obj:OBJ_HEBDO},
    {k:'mois', lbl:'Mois en cours ('+d.toLocaleDateString('fr-FR',{month:'2-digit',year:'numeric'})+')', real:sumEnc(m1,d), obj:Math.round(OBJ_HEBDO*52/12)},
  ];
}

/* ================= Actions (boutons) ================= */
function selFactOptions(tiers, selId){
  const list = factures.filter(f=>f.tiers===tiers && rap(f)>0.5).sort((a,b)=>rap(b)-rap(a));
  const sel = document.getElementById(selId);
  sel.innerHTML = '<option value="">— Sélectionner la facture —</option>' + list.map(f=>
    `<option value="${f.id}">N° ${f.num} · ${f.immat||f.veh||'—'} · reste ${F(rap(f))}</option>`).join('');
}
function onEncTiers(){ selFactOptions(document.getElementById('encTiers').value,'encFact'); onEncCheck(); }
function onEncCheck(){
  const h = document.getElementById('encHint');
  const fid = +document.getElementById('encFact').value, m = +document.getElementById('encMont').value;
  if(!fid){ h.className='hint'; h.textContent='Choisir un tiers puis la facture : la liste affiche le reste à payer de chacune.'; return; }
  const f = factures.find(x=>x.id===fid), r = rap(f);
  if(m > r + 0.5){ h.className='hint warn'; h.textContent='⚠ Montant supérieur au reste à payer de la facture ('+F(r)+'). Corriger avant enregistrement.'; }
  else { h.className='hint ok'; h.textContent='✓ Facture N° '+f.num+' — reste à payer : '+F(r)+(m?(' · après encaissement : '+F(r-(m||0))):''); }
}
function saveEnc(){
  const tiers=document.getElementById('encTiers').value, fid=+document.getElementById('encFact').value;
  const mode=document.getElementById('encMode').value, m=+document.getElementById('encMont').value;
  const date=document.getElementById('encDate').value, ref=document.getElementById('encRef').value.trim();
  if(!tiers||!fid||!mode||!m||!date){ toast('Encaissement : renseigner date, tiers, facture, mode et montant.'); return; }
  const f=factures.find(x=>x.id===fid);
  if(m > rap(f)+0.5){ toast('Refusé : montant supérieur au reste à payer ('+F(rap(f))+').'); return; }
  f.encPost += m;
  encaissements.unshift({date, tiers, factId:fid, num:f.num, mode, montant:m, ref, par:ROLES[role].nom.replace('Session : ','')});
  log('Encaissement enregistré', tiers+' · fact. '+f.num+' · '+F(m)+' · '+mode);
  toast('Encaissement de '+F(m)+' affecté à la facture N° '+f.num+' — toutes les vues sont à jour.');
  renderAll();
}
function onRelTiers(){
  const t=document.getElementById('relTiers').value;
  const list = factures.filter(f=>f.tiers===t && rap(f)>0.5);
  const maxN = list.length? Math.max(...list.map(f=>niveau(f).n)) : 0;
  const solde = list.reduce((s,f)=>s+rap(f),0);
  const h=document.getElementById('relHint');
  if(!t){h.className='hint';h.textContent='Le niveau proposé découle de l’ancienneté la plus élevée des factures ouvertes du tiers.';return;}
  const sug = Math.min(maxN||1, can('nivMax'));
  document.getElementById('relNiv').value = 'N'+Math.max(1,sug);
  h.className = maxN>can('nivMax') ? 'hint warn' : 'hint ok';
  h.textContent = (maxN>can('nivMax')
    ? '⚠ Ce dossier appelle un niveau N'+maxN+' — au-delà de votre habilitation (N'+can('nivMax')+' max). Escalader au '+(maxN>=5?'Gérant':'Superviseur')+'.'
    : '✓ Solde du tiers : '+F(solde)+' · niveau suggéré : N'+Math.max(1,sug)+'.');
  selRelFacts(t);
}
function selRelFacts(t){
  const list = factures.filter(f=>f.tiers===t && rap(f)>0.5).sort((a,b)=>rap(b)-rap(a));
  document.getElementById('relFact').innerHTML = '<option value="">Situation globale</option>'+
    list.map(f=>`<option>N° ${f.num} · reste ${F(rap(f))}</option>`).join('');
}
function saveRel(){
  const t=document.getElementById('relTiers').value, niv=document.getElementById('relNiv').value;
  const canal=document.getElementById('relCanal').value, res=document.getElementById('relRes').value.trim();
  const date=document.getElementById('relDate').value, statut=document.getElementById('relStatut').value;
  if(!t||!niv||!canal||!date){ toast('Relance : renseigner date, tiers, niveau et canal.'); return; }
  const nN = +niv.replace('N','');
  if(nN > can('nivMax')){ toast('Refusé : le niveau '+niv+' dépasse votre habilitation (N'+can('nivMax')+' max).'); return; }
  relances.unshift({date, tiers:t, factures:document.getElementById('relFact').value||'Situation globale',
    niveau:niv, canal, interloc:document.getElementById('relInter').value.trim(), resultat:res,
    promis:+document.getElementById('relPromis').value||0, resp:ROLES[role].nom.replace('Session : ',''), statut});
  log('Relance '+niv+' tracée', t+' · '+canal);
  toast('Relance '+niv+' enregistrée pour '+t+'.');
  renderAll();
}
function saveFact(){
  if(!can('facture')){ toast('Habilitation insuffisante : la création de facture relève du Superviseur ou du Gérant.'); return; }
  const t=document.getElementById('fTiers').value, num=document.getElementById('fNum').value.trim();
  const ttc=+document.getElementById('fTTC').value, date=document.getElementById('fDate').value;
  if(!t||!num||!ttc||!date){ toast('Facture : renseigner tiers, date, n° et montant TTC.'); return; }
  if(factures.some(f=>f.tiers===t && f.num===num)){ toast('Refusé : le n° '+num+' existe déjà pour '+t+' (doublon).'); return; }
  factures.push({id:nextId++, tiers:t, site:document.getElementById('fSite').value, date, num,
    veh:document.getElementById('fVeh').value.trim(), immat:document.getElementById('fImmat').value.trim(),
    ttc, regle:0, encPost:0});
  log('Facture créée', t+' · N° '+num+' · '+F(ttc));
  toast('Facture N° '+num+' créée pour '+t+' — intégrée à la balance âgée et à l’extrait.');
  renderAll();
}
function saveClient(){
  if(!can('client')){ toast('Habilitation insuffisante.'); return; }
  const n=document.getElementById('cNom').value.trim().toUpperCase();
  if(!n){ toast('Saisir le nom du tiers.'); return; }
  if(clients.includes(n)){ toast('Refusé : « '+n+' » existe déjà — ne pas créer de doublon.'); return; }
  clients.push(n); clients.sort();
  log('Tiers créé', n);
  toast('Tiers « '+n+' » créé : disponible dans toutes les listes déroulantes.');
  renderAll();
}
function saveCmt(k, v){ commentaires[k]=v; log('Commentaire d’écart ('+k+')', v.slice(0,60)); }

  return `<div class="kpis">
    <div class="kpi red"><div class="k-lab">Reste à payer (périmètre maquette)</div><div class="kpi-val mono">${fmt(totR)}</div><div class="k-sub">F CFA · ${o.length} factures ouvertes</div></div>
    <div class="kpi"><div class="k-lab">Encaissé (session)</div><div class="kpi-val mono">${fmt(encTot)}</div><div class="k-sub">${encaissements.length} opération(s)</div></div>

function topTiers(){
  const m={}; ouvertes().forEach(f=>{ (m[f.tiers]=m[f.tiers]||{tiers:f.tiers,rap:0,nb:0,maxN:{n:-1}}); m[f.tiers].rap+=rap(f); m[f.tiers].nb++; const nv=niveau(f); if(nv.n>m[f.tiers].maxN.n)m[f.tiers].maxN=nv; });
  return Object.values(m).map(t=>({...t,niv:t.maxN})).sort((a,b)=>b.rap-a.rap);
}

  <div style="display:flex;justify-content:space-between;border-bottom:3px solid var(--noir);padding-bottom:10px;margin-bottom:12px">
    <div><div style="font-family:Archivo;font-weight:800;font-size:18px">L'ARTISAN AUTOMOBILE</div>
    <div class="mono" style="font-size:12px">NCC : 2197588 Q · 10 BP 259 ABIDJAN 10</div></div>
    <div style="text-align:right"><div style="font-family:Archivo;font-weight:800;color:var(--rouge)">EXTRAIT DE COMPTE</div>
    <div style="font-size:12px"><b>${t}</b> · arrêté au ${workDate().toLocaleDateString('fr-FR')}</div></div>
  </div>
  <div class="tbl-wrap" style="max-height:520px"><table><thead><tr><th>Date</th><th>N° facture</th><th>Véhicule</th><th>Immat.</th><th class="num">Montant TTC</th><th class="num">Réglé</th><th class="num">Reste à payer</th><th>Ancienneté</th></tr></thead><tbody>
  ${list.map(f=>{const nv=niveau(f);return `<tr><td class="mono">${f.date?new Date(f.date).toLocaleDateString('fr-FR'):'—'}</td><td class="mono">${f.num}</td><td>${f.veh||''}</td><td class="mono">${f.immat||''}</td><td class="num mono">${fmt(f.ttc)}</td><td class="num mono">${fmt(f.regle+f.encPost)}</td><td class="num mono"><b>${fmt(rap(f))}</b></td><td><span class="pill ${nv.cls}">${nv.n?nv.lbl:(rap(f)<=0.5?'Soldée':nv.lbl)}</span></td></tr>`;}).join('')}
  <tr class="tot"><td colspan="4">TOTAUX</td><td class="num mono">${fmt(sTTC)}</td><td class="num mono">${fmt(sReg)}</td><td class="num mono">${fmt(sRap)}</td><td></td></tr>
  </tbody></table></div>
  <div class="hint" style="margin-top:10px">Extrait établi sur les écritures enregistrées ; tout règlement postérieur à la date de travail n'y figure pas. Document généré par la console recouvrement — Cabinet DC-KNOWING pour L2A.</div>`
  :'<div class="hint">Sélectionner un tiers : son extrait complet (factures, règlements, restes à payer, anciennetés) se génère instantanément.</div>'}
  </div>`;
}
function vRelances(){
  return `<div class="card"><h2>Journal des relances <span class="chip">${relances.length} action(s)</span></h2>
  <div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Tiers</th><th>Factures</th><th>Niveau</th><th>Canal</th><th>Interlocuteur</th><th>Résultat / engagement</th><th class="num">Promis</th><th>Resp.</th><th>Statut</th></tr></thead><tbody>
  ${relances.length?relances.map(r=>{const n=+r.niveau.replace('N','');return `<tr><td class="mono">${new Date(r.date).toLocaleDateString('fr-FR')}</td><td><b>${r.tiers}</b></td><td>${r.factures}</td><td><span class="pill pN${n}">${r.niveau}</span></td><td>${r.canal}</td><td>${r.interloc||''}</td><td>${r.resultat||''}</td><td class="num mono">${r.promis?fmt(r.promis):'·'}</td><td>${r.resp}</td><td>${r.statut}</td></tr>`;}).join('')
  :'<tr><td colspan="10" style="text-align:center;color:var(--acier);padding:26px">Aucune relance tracée dans cette session — utiliser le formulaire de la vue Saisie.</td></tr>'}
  </tbody></table></div>
  <div class="hint">Protocole : N1 e-mail J+7 → N2 téléphone J+15 → N3 lettre J+30 → N4 mise en demeure J+60 (Direction) → N5 contentieux J+90 (injonction de payer, AUPSRVE).</div></div>`;
}
function vEnc(){
  const parMode = MODES.map(m=>({m, v:encaissements.filter(e=>e.mode===m).reduce((s,e)=>s+e.montant,0), n:encaissements.filter(e=>e.mode===m).length}));
  return `<div class="grid g2"><div class="card"><h2>Journal des encaissements <span class="chip">${encaissements.length} opération(s)</span></h2>
  <div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Tiers</th><th>Facture</th><th>Mode</th><th class="num">Montant</th><th>Référence</th><th>Par</th></tr></thead><tbody>
  ${encaissements.length?encaissements.map(e=>`<tr><td class="mono">${new Date(e.date).toLocaleDateString('fr-FR')}</td><td><b>${e.tiers}</b></td><td class="mono">N° ${e.num}</td><td>${e.mode}</td><td class="num mono"><b>${fmt(e.montant)}</b></td><td class="mono">${e.ref||''}</td><td>${e.par}</td></tr>`).join('')
  :'<tr><td colspan="7" style="text-align:center;color:var(--acier);padding:26px">Aucun encaissement dans cette session — utiliser le formulaire de la vue Saisie.</td></tr>'}
  </tbody></table></div></div>
  <div class="card"><h2>Synthèse par mode</h2>
  <table><thead><tr><th>Mode</th><th class="num">Montant</th><th class="num">Nb</th></tr></thead><tbody>
  ${parMode.map(x=>`<tr><td>${x.m}</td><td class="num mono">${x.v?fmt(x.v):'·'}</td><td class="num">${x.n||'·'}</td></tr>`).join('')}
  <tr class="tot"><td>TOTAL</td><td class="num mono">${fmt(encaissements.reduce((s,e)=>s+e.montant,0))}</td><td class="num">${encaissements.length}</td></tr>
  </tbody></table>
  <div class="hint">Cette synthèse alimente le rapprochement bancaire (BGFI, BDA), le contrôle de caisse (espèces) et la réconciliation des relevés Orange Money / Wave.</div>
  </div></div>`;
}
function vAudit(){
  return `<div class="card"><h2>Piste d'audit <span class="chip">Gérant uniquement</span></h2>
  <div class="tbl-wrap"><table><thead><tr><th>Horodatage</th><th>Session</th><th>Action</th><th>Détail</th></tr></thead><tbody>
  ${audit.length?audit.map(a=>`<tr><td class="mono">${a.ts}</td><td>${a.role}</td><td><b>${a.action}</b></td><td>${a.detail}</td></tr>`).join('')
  :'<tr><td colspan="4" style="text-align:center;color:var(--acier);padding:26px">Aucune action enregistrée.</td></tr>'}
  </tbody></table></div>
  <div class="hint">Chaque création, encaissement, relance et changement de session est horodaté et attribué — réponse directe à la faille de traçabilité relevée par l'audit (dévalidation de dossiers sans journal).</div></div>`;
}
const SUBS = {saisie:"Formulaires à boutons : chaque enregistrement met à jour toutes les vues instantanément.",
  synthese:"Pilotage du recouvrement : objectif vs réalisé (jour / semaine / mois), balance âgée, top débiteurs.",
  balance:"Encours par tiers et par tranche d'ancienneté — recalculé après chaque saisie.",
  extrait:"Extrait de compte par client, imprimable, avec anciennetés et niveaux de relance.",
  relances:"Historique des actions de relance N1 → N5.", encaissements:"Historique des règlements par mode : banque, espèce, mobile money.",
  audit:"Journal horodaté de toutes les actions, par session."};
function renderAll(){
  nav();
  const T={saisie:'Saisie',synthese:'Synthèse & pilotage',balance:'Balance âgée',extrait:'Extrait de compte',relances:'Journal des relances',encaissements:'Journal des encaissements',audit:"Piste d'audit"};
  document.getElementById('vTitle').textContent = T[curView];
  document.getElementById('vSub').textContent = SUBS[curView];
  const V={saisie:vSaisie,synthese:vSynthese,balance:vBalance,extrait:vExtrait,relances:vRelances,encaissements:vEnc,audit:vAudit};
  document.getElementById('views').innerHTML = V[curView]();
}
log('Ouverture de session','Agent de recouvrement');
renderAll();
</script>
</body>
</html>
